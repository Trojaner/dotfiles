set -g prefix C-h
bind C-h send-prefix
unbind C-b
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys on
set -g allow-passthrough on
set -g set-clipboard on
set -g destroy-unattached off
set -g detach-on-destroy previous
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY PATH TERM_PROGRAM TERM_PROGRAM_VERSION COLORTERM BROWSER GIT_ASKPASS VSCODE_GIT_ASKPASS_NODE VSCODE_GIT_ASKPASS_MAIN VSCODE_GIT_ASKPASS_EXTRA_ARGS VSCODE_GIT_IPC_HANDLE VSCODE_IPC_HOOK_CLI"
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=#21222c fg=#f8f8f2"
set -g message-style "bg=#44475a fg=#f8f8f2"
set -g message-command-style "bg=#44475a fg=#ff79c6"
set -g @tab_cmd '#{?#{m/r:^[0-9][0-9.]*$,#{pane_current_command}},claude,#{s/-[0-9].*$//:pane_current_command}}'
set -g @tab_name '#{?#{m/r:^[0-9]+$,#{session_name}},#{E:@tab_cmd},#{session_name}}'
set -g @tab '#[range=session|#{session_id}]#[fg=#6272a4 bg=#21222c]#[fg=#f8f8f2 bg=#6272a4 bold]#{@tab_index} #[fg=#f8f8f2 bg=#44475a] #{E:@tab_name}#{?@permanent,#[fg=#ffb86c] 󰐃,} #[fg=#44475a bg=#21222c nobold]#[default]#[norange]'
set -g @tab_current '#[range=session|#{session_id}]#[fg=#ff79c6 bg=#21222c]#[fg=#282a36 bg=#ff79c6 bold]#{@tab_index} #[fg=#282a36 bg=#bd93f9] #{E:@tab_name}#{?@permanent,#[fg=#282a36] 󰐃,} #[fg=#bd93f9 bg=#21222c nobold]#[default]#[norange]'
set -g status-left-length 400
set -g status-left "#[fg=#bd93f9 bg=#21222c bold]  #[default]#{S/i:#{E:@tab} ,#{E:@tab_current} }"
set -g status-right-length 80
set -g status-right "#[fg=#44475a bg=#21222c]#[fg=#8be9fd bg=#44475a]󰒋 #h #[fg=#bd93f9] %H:%M#[fg=#44475a bg=#21222c] "
set -g status-justify right
set -g window-status-format "#{?#{>:#{session_windows},1},#[fg=#6272a4] #I #W ,}"
set -g window-status-current-format "#{?#{>:#{session_windows},1},#[fg=#ff79c6 bold] #I #W ,}"
set -g window-status-separator ""
bind -n MouseDown1Status switch-client -t =
bind c new-session -c "#{pane_current_path}"
bind & confirm-before -p "Close tab #{@tab_index} #{E:@tab_name}? (y/n)" kill-session
bind -n MouseDown2Status if -F "#{==:#{mouse_status_range},session}" { kill-session -t = }
bind 1 run-shell "~/.config/tmux/vscode-goto.sh '#{client_name}' 1"
bind 2 run-shell "~/.config/tmux/vscode-goto.sh '#{client_name}' 2"
bind 3 run-shell "~/.config/tmux/vscode-goto.sh '#{client_name}' 3"
bind 4 run-shell "~/.config/tmux/vscode-goto.sh '#{client_name}' 4"
bind 5 run-shell "~/.config/tmux/vscode-goto.sh '#{client_name}' 5"
bind 6 run-shell "~/.config/tmux/vscode-goto.sh '#{client_name}' 6"
bind 7 run-shell "~/.config/tmux/vscode-goto.sh '#{client_name}' 7"
bind 8 run-shell "~/.config/tmux/vscode-goto.sh '#{client_name}' 8"
bind 9 run-shell "~/.config/tmux/vscode-goto.sh '#{client_name}' 9"
bind 0 run-shell "~/.config/tmux/vscode-goto.sh '#{client_name}' 10"
bind r command-prompt -I "#{s/^[0-9]+$//:session_name}" -p "rename:" { rename-session -- "%%" }
set-hook -g client-attached { if -F "#{==:#{@owner},}" { set -F @owner "#{hook_client}" } }
set-hook -g client-session-changed { if -F "#{==:#{@owner},}" { set -F @owner "#{hook_client}" } }
set-hook -g session-created { run-shell "~/.config/tmux/vscode-renumber.sh" }
set-hook -g session-closed { run-shell "~/.config/tmux/vscode-renumber.sh" }
set-hook -g client-detached { run-shell "~/.config/tmux/vscode-reap.sh '#{hook_client}'" }
bind P if -F "#{@permanent}" {
  set -u @permanent
  set -F @owner "#{client_name}"
  refresh-client -S
  display "Session #S is temporary again: it closes with this terminal"
} {
  set @permanent 1
  refresh-client -S
  display "Session #S is permanent: it survives closing its terminal"
}
